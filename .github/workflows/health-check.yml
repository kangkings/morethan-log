name: Blog Health Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check blog posts loaded
        run: |
          RESPONSE=$(curl -s --max-time 30 https://kangking.vercel.app)
          
          if echo "$RESPONSE" | grep -q "SpringSecurity를 나름대로 이해해보기"; then
            echo "✅ 블로그 정상"
          else
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-type: application/json' \
              -d '{"text":"🚨 블로그 게시글 로드 실패 - 확인 필요\nhttps://kangking.vercel.app"}'
            exit 1
          fi